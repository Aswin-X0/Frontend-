<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        body {
            background: linear-gradient(to right, rgb(197, 235, 243), rgb(224, 193, 242));
        }

        .contact-box {
            max-width: 500px;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px 12px;
        }

        .container {
            margin-top: 100px;
            margin-bottom: 100px;
            padding-left: 40px;
            padding-right: 40px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="contact-box p-4 shadow rounded">

                <h2 class="text-center">Contact us here...</h2>
                <form>

                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="username">
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Enter ur email Address" required>
                    </div>
                    <div class="mb-3">
                        <input type="tel" class="form-control" placeholder="Mobile Number" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="SUBJECT" required>
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlTextarea1" class="form-label"> Write your issue here.</label>
                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-outline-success btn-submit">SUBMIT</button>

                    <a href="https://google.com" class="btn btn-outline-success" target="_blank">
                        Open Google
                    </a>

                </form>
            </div>
        </div>
    </div>
</body>

</html>
