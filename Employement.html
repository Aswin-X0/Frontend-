<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, rgb(197, 235, 243), rgb(224, 193, 242));
        }
        .contact-box {
            max-width: 500px;
            margin: auto;
        }

        .container {
            margin-top: 100px;
            margin-bottom: 100px;
            padding-left: 40px;
            padding-right: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="contact-box p-4 shadow rounded bg-white">

            <h4>Select your employment type</h4>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="employment" id="employed">
                <label class="form-check-label" for="employed">
                    Employed
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="employment" id="unemployed">
                <label class="form-check-label" for="unemployed">
                    Unemployed
                </label>
            </div>

        </div>
    </div>

</body>
</html>
