<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Input Elements</title>
</head>
<body>

    <h2>HTML Input Elements </h2>

    <form>
        <fieldset>
            <legend>Text Inputs</legend>

            <label>Text:</label>
            <input type="text" name="text"><br><br>

            <label>Password:</label>
            <input type="password" name="password"><br><br>

            <label>Email:</label>
            <input type="email" name="email"><br><br>

            <label>Number:</label>
            <input type="number" name="number"><br><br>

            <label>Telephone:</label>
            <input type="tel" name="phone"><br><br>

            <label>Search:</label>
            <input type="search" name="search"><br><br>

            <label>URL:</label>
            <input type="url" name="website"><br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Date and Time Inputs</legend>

            <label>Date:</label>
            <input type="date" name="date"><br><br>

            <label>Time:</label>
            <input type="time" name="time"><br><br>

            <label>Month:</label>
            <input type="month" name="month"><br><br>

            <label>Week:</label>
            <input type="week" name="week"><br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Selection Inputs</legend>

            <label>Radio:</label>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female<br><br>

            <label>Checkbox:</label>
            <input type="checkbox" name="skill1"> HTML
            <input type="checkbox" name="skill2"> CSS
            <input type="checkbox" name="skill3"> JavaScript<br><br>

            <label>Range:</label>
            <input type="range" name="range" min="0" max="100"><br><br>
            
        </fieldset>

        <br>

        <fieldset>
            <legend>File and Hidden Inputs</legend>

            <label>File:</label>
            <input type="file" name="file"><br><br>

            <input type="hidden" name="userid" value="12345">
        </fieldset>

        <br>

        <fieldset>
            <legend>Buttons</legend>

            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
            <input type="button" value="Click Me">
        </fieldset>
    </form>

</body>
</html>
